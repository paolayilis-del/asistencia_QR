services:
  - type: web
    name: asistencia-qr
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: python servidor.py --produccion
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: SEED_ADMIN_EMAIL
        value: admin@datly.local
      - key: CORS_ORIGINS
        value: https://asistencia-qr-0cjy.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: asistencia-db
          property: connectionString

databases:
  - name: asistencia-db
    plan: free
    region: oregon
